<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Routexa | Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-brand-mark" aria-hidden="true">
        <svg width="62" height="62" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="loginLogoGrad" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="50%" stop-color="#818cf8"/>
              <stop offset="100%" stop-color="#c084fc"/>
            </linearGradient>
            <filter id="loginLogoGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#38bdf8" flood-opacity="0.65"/>
            </filter>
          </defs>
          <polygon points="24,4 43,14.5 43,33.5 24,44 5,33.5 5,14.5" stroke="url(#loginLogoGrad)" stroke-width="2.6" stroke-linejoin="round" fill="rgba(15, 23, 42, 0.65)"/>
          <path d="M17 34V14H27C30.3 14 33 16.7 33 20C33 23.3 30.3 26 27 26H17M25 26L34 34" stroke="url(#loginLogoGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="24" cy="4" r="3.2" fill="#38bdf8" filter="url(#loginLogoGlow)"/>
          <circle cx="43" cy="14.5" r="2.8" fill="#818cf8"/>
          <circle cx="43" cy="33.5" r="2.8" fill="#c084fc"/>
          <circle cx="24" cy="44" r="3.2" fill="#38bdf8" filter="url(#loginLogoGlow)"/>
          <circle cx="5" cy="33.5" r="2.8" fill="#38bdf8"/>
          <circle cx="5" cy="14.5" r="2.8" fill="#818cf8"/>
          <circle cx="27" cy="20" r="2.8" fill="#ffffff" filter="url(#loginLogoGlow)"/>
        </svg>
      </div>
      <p class="login-eyebrow">ROUTEXA INTELLIGENCE</p>
      <h1 id="login-title">Sign in to your workspace</h1>
      <p class="login-subtitle">Access route prediction, live signals, and disruption analytics.</p>

      {% if error %}
      <div class="login-error" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" class="login-form">
        <input type="hidden" name="next" value="{{ next_url }}">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit" class="login-submit">Sign in</button>
      </form>

      <a class="login-back-link" href="{{ url_for('forgot_password') }}">Forgot password?</a>
      <p class="login-note">Authorized users only</p>
    </section>
  </main>
</body>
</html>
