<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Routexa | Change Password</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="change-title">
      {% set logo_id = 'changeLogoGrad' %}
      {% set glow_id = 'changeLogoGlow' %}
      {% include '_brand_logo.html' %}
      <p class="login-eyebrow">ACCOUNT SECURITY</p>
      <h1 id="change-title">Change password</h1>
      <p class="login-subtitle">Update the password for your Routexa account.</p>

      {% if error %}<div class="login-error" role="alert">{{ error }}</div>{% endif %}
      {% if success %}<div class="login-success" role="status">{{ success }}</div>{% endif %}

      <form method="post" class="login-form">
        <label for="current_password">Current password</label>
        <input id="current_password" name="current_password" type="password" autocomplete="current-password" required autofocus>
        <label for="new_password">New password</label>
        <input id="new_password" name="new_password" type="password" minlength="8" autocomplete="new-password" required>
        <label for="confirm_password">Confirm new password</label>
        <input id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required>
        <button type="submit" class="login-submit">Change password</button>
      </form>
      <a class="login-back-link" href="{{ url_for('index') }}">Back to dashboard</a>
    </section>
  </main>
</body>
</html>
