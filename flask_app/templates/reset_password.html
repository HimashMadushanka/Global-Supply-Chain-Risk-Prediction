<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Routexa | Reset Password</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="reset-title">
      <div class="login-brand-mark" aria-hidden="true"><span>R</span></div>
      <p class="login-eyebrow">ACCOUNT RECOVERY</p>
      <h1 id="reset-title">Choose a new password</h1>
      <p class="login-subtitle">Use at least 8 characters for your new password.</p>

      {% if error %}<div class="login-error" role="alert">{{ error }}</div>{% endif %}
      {% if success %}
      <div class="login-success" role="status">{{ success }}</div>
      <a class="login-back-link" href="{{ url_for('login') }}">Continue to sign in</a>
      {% else %}
      <form method="post" class="login-form">
        <label for="new_password">New password</label>
        <input id="new_password" name="new_password" type="password" minlength="8" autocomplete="new-password" required autofocus>
        <label for="confirm_password">Confirm new password</label>
        <input id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required>
        <button type="submit" class="login-submit">Reset password</button>
      </form>
      {% endif %}
    </section>
  </main>
</body>
</html>
